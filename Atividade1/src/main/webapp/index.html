	<h1>Livros</h1>
	<form action="CreateLivroServlet" method="POST">

	<input id="texto" type="text" name="nome" placeholder="Digite seu nome"><br><br>
	
	
	<label for="texto1" >Autor do Livro:</label>
	<input id="texto1" type="text" name="autor" placeholder="Digite o autor"><br><br>
	
	
	<label for="ano" >Ano de publicação:</label>
	<input id ="ano" type="number" name="ano"><br><br>
	
	<h3>Genero</h3>
	
	<input id="ficcao" type="checkbox" name="genero" value="ficcao">

	<input id="nficcao" type="checkbox" name="genero" value = "naoficcao">

	<input id="fantasia" type="checkbox" name="genero" value = "fantasia">
	<label for="fantasia" >Fantasia</label><br>
	
	
	<input id="romance" type="checkbox" name="genero" value = "romance">

	<input type="submit" value="Enviar">
	</form>
